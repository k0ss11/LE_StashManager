name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Source only (no binary files tracked; screenshots in docs/images/*.png allowed)
        shell: bash
        run: |
          bin=$(git diff --numstat "$(git hash-object -t tree /dev/null)" HEAD | awk '$1=="-"{print $3}' | grep -v -E '^docs/images/[^/]+\.png$' || true)
          if [ -n "$bin" ]; then echo "::error::binary files tracked:"; echo "$bin"; exit 1; fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Python compiles
        run: python -m compileall -q host.py game_client.py mover.py prices.py log_setup.py tools

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript parses
        shell: bash
        run: |
          for f in agent/agent.js web/*.js tools/*.js; do node --check "$f" || exit 1; done
          # inline script of the page
          python -c "import re;s=open('web/index.html',encoding='utf-8').read();open('page.js','w',encoding='utf-8').write(re.search(r'<script>(.*?)</script>',s,re.S).group(1))"
          node --check page.js

      - name: JSON is valid
        shell: bash
        run: for f in presets/*.json supported_builds.json; do python -m json.tool "$f" > /dev/null || exit 1; done
